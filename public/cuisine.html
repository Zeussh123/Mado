<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mado · Cuisine</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#161616;--surface:#222;--surface-2:#2b2b2b;--line:#383838;--text:#f4f1ec;--muted:#a9a39a;--accent:#f39200;--ink:#1a1100;--green:#5cb85c;--red:#e5534b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.35}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 14px;font-weight:700}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
button.ok{background:var(--green);border-color:var(--green);color:#08210a}
input{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login form{width:min(360px,100%);display:grid;gap:14px;text-align:center}
#login img{width:220px;margin:0 auto}
.err{color:#ff8d86;min-height:1.2em}
#app{display:none}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(22,22,22,.96);border-bottom:1px solid var(--line)}
header img{height:34px}
header h1{font-size:1.1rem;margin:0;flex:1}
.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
.live .dot{width:10px;height:10px;border-radius:50%;background:var(--red)}
.live.on .dot{background:var(--green);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}
label.sw{display:flex;align-items:center;gap:6px;font-size:.9rem}
label.sw input{width:18px;height:18px;accent-color:var(--accent)}
#start{margin:16px;padding:16px;border-radius:14px;background:#3a2400;border:1px solid #6b4e00;color:#ffd38a;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#start p{margin:0;flex:1;min-width:220px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:16px}
.col-title{grid-column:1/-1;margin:8px 0 0;font-size:1rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.order{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.order.new{border-color:var(--accent)}
.order.flash{animation:flash 1s ease 3}
@keyframes flash{50%{background:#3a2400}}
.order.ready{border-color:var(--green)}
.order.done,.order.cancelled{opacity:.55}
.oh{display:flex;align-items:baseline;gap:10px}
.oh .t{font-size:1.6rem;font-weight:900}
.oh .n{color:var(--muted);font-weight:700}
.oh .time{margin-left:auto;color:var(--muted);font-size:.9rem}
.ln{border-top:1px dashed var(--line);padding-top:6px}
.ln b{font-size:1.05rem}
.ln .d{color:var(--muted);font-size:.88rem}
.note{background:#3a2400;color:#ffd38a;border-radius:10px;padding:8px 10px;font-weight:700}
.of{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.of .tot{margin-right:auto;font-weight:900;color:var(--accent);font-size:1.1rem}
.empty{color:var(--muted);padding:30px 16px;text-align:center}
#ticket{display:none}
@media print{
  @page{size:80mm auto;margin:0}
  body{background:#fff;color:#000}
  #app,#login{display:none!important}
  #ticket{display:block;width:72mm;margin:0 auto;padding:2mm 0 6mm;font-family:"Courier New",monospace;font-size:12pt;color:#000}
  #ticket .c{text-align:center}
  #ticket .big{font-size:26pt;font-weight:900;text-align:center;margin:2mm 0}
  #ticket hr{border:0;border-top:1px dashed #000;margin:2mm 0}
  #ticket .l{font-weight:900;font-size:13pt;margin-top:2mm}
  #ticket .d{font-size:11pt;padding-left:3mm}
  #ticket .nt{border:2px solid #000;padding:1.5mm;font-weight:900;margin-top:2mm}
  #ticket .tot{display:flex;justify-content:space-between;font-weight:900;font-size:13pt}
}
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <img src="img/logo.png" alt="Mado">
    <h2 style="margin:0">Cuisine</h2>
    <input id="pw" type="password" placeholder="Mot de passe de l'admin" autocomplete="current-password" required>
    <button class="primary" type="submit">Ouvrir</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="app">
  <header>
    <img src="img/logo.png" alt="">
    <h1>Commandes du jour</h1>
    <span class="live" id="live"><span class="dot"></span><span id="liveTxt">Hors ligne</span></span>
    <label class="sw"><input type="checkbox" id="autoPrint" checked> Impression auto</label>
    <label class="sw"><input type="checkbox" id="showDone"> Voir les servies</label>
  </header>
  <div id="start">
    <p><b>Touchez « Démarrer » une fois</b> pour activer le son et l'impression des nouvelles commandes. Laissez cette page ouverte.</p>
    <button class="primary" id="startBtn">Démarrer</button>
  </div>
  <div class="cols" id="list"></div>
</div>
<div id="ticket"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = (n) => new Intl.NumberFormat("fr-FR", {style:"currency", currency:"EUR"}).format(n);
const hm = (iso) => new Date(iso).toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
const ls = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };
let token = (() => { try { return sessionStorage.getItem("mado-admin") || ls.get("mado-kitchen") || ""; } catch { return ""; } })();
let ORDERS = [], printed = new Set((ls.get("mado-printed") || "").split(",").filter(Boolean).map(Number)), started = false, audio = null, firstLoad = true;
const api = (p, o = {}) => fetch(p, {...o, headers: {...(o.headers || {}), authorization: "Bearer " + token}});

/* ----- son ----- */
function beep(){
  if (!audio) return;
  const t = audio.currentTime;
  [0, .18, .36].forEach((d, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = i === 2 ? 1320 : 880; o.type = "square";
    g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(.3, t + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d + .16);
    o.connect(g).connect(audio.destination); o.start(t + d); o.stop(t + d + .17);
  });
}

/* ----- impression du ticket 80 mm ----- */
const queue = []; let printing = false;
function ticketHtml(o){
  return `<div class="c">MADO</div><div class="big">TABLE ${esc(o.table_no)}</div>
    <div class="c">Commande n° ${o.num} · ${hm(o.created_at)}</div><hr>
    ${o.lines.map(l => `<div class="l">${l.qty} x ${esc(l.name)}</div>${l.details.map(d => `<div class="d">${esc(d.group)} : ${esc(d.choices.join(", "))}</div>`).join("")}`).join("")}
    ${o.note ? `<div class="nt">NOTE : ${esc(o.note)}</div>` : ""}<hr>
    <div class="tot"><span>TOTAL</span><span>${eur(o.total)}</span></div><div class="c" style="margin-top:2mm">À payer au comptoir</div>`;
}
function printOrder(o){ queue.push(o); runQueue(); }
function runQueue(){
  if (printing || !queue.length) return;
  printing = true; const o = queue.shift();
  $("#ticket").innerHTML = ticketHtml(o);
  setTimeout(() => { window.print(); printed.add(o.id); ls.set("mado-printed", [...printed].slice(-300).join(",")); printing = false; setTimeout(runQueue, 400); }, 50);
}

/* ----- liste ----- */
function render(){
  const showDone = $("#showDone").checked;
  const act = ORDERS.filter(o => o.status === "new" || o.status === "ready");
  const old = ORDERS.filter(o => o.status === "done" || o.status === "cancelled");
  const card = (o) => `<div class="order ${o.status} ${o._flash ? "flash" : ""}" data-id="${o.id}">
    <div class="oh"><span class="t">Table ${esc(o.table_no)}</span><span class="n">n° ${o.num}</span><span class="time">${hm(o.created_at)}</span></div>
    ${o.lines.map(l => `<div class="ln"><b>${l.qty} × ${esc(l.name)}</b>${l.details.map(d => `<div class="d">${esc(d.group)} : ${esc(d.choices.join(", "))}</div>`).join("")}</div>`).join("")}
    ${o.note ? `<div class="note">📝 ${esc(o.note)}</div>` : ""}
    <div class="of"><span class="tot">${eur(o.total)}</span>
      <button data-a="print">🖨 Réimprimer</button>
      ${o.status === "new" ? `<button class="primary" data-a="ready">Prête</button>` : ""}
      ${o.status === "new" || o.status === "ready" ? `<button class="ok" data-a="done">Servie ✓</button>` : `<button data-a="new">Remettre en cours</button>`}
    </div></div>`;
  $("#list").innerHTML = (act.length ? act.map(card).join("") : `<div class="empty">Aucune commande en cours.</div>`)
    + (showDone && old.length ? `<h2 class="col-title">Servies</h2>` + old.map(card).join("") : "");
  ORDERS.forEach(o => o._flash = false);
}

async function load(){
  try {
    const r = await api("/api/orders", {cache: "no-store"});
    if (r.status === 401) { location.reload(); return; }
    const j = await r.json(); if (!r.ok) throw new Error(j.error);
    const known = new Set(ORDERS.map(o => o.id));
    const fresh = j.orders.filter(o => !known.has(o.id) && o.status === "new");
    ORDERS = j.orders;
    if (!firstLoad && fresh.length) { beep(); fresh.forEach(o => { const x = ORDERS.find(y => y.id === o.id); x._flash = true; }); }
    if (started && $("#autoPrint").checked) ORDERS.filter(o => o.status === "new" && !printed.has(o.id)).reverse().forEach(printOrder);
    firstLoad = false;
    $("#live").classList.add("on"); $("#liveTxt").textContent = "En ligne · " + new Date().toLocaleTimeString("fr-FR");
    render();
  } catch (e) {
    $("#live").classList.remove("on"); $("#liveTxt").textContent = "Connexion perdue, nouvel essai…";
  }
}

$("#list").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const o = ORDERS.find(x => x.id === +b.closest(".order").dataset.id);
  if (b.dataset.a === "print") return printOrder(o);
  b.disabled = true;
  await api(`/api/orders/${o.id}/status`, {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({status: b.dataset.a})});
  load();
});
$("#showDone").onchange = render;
$("#startBtn").onclick = () => {
  started = true;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); beep(); } catch {}
  // les commandes déjà là ne sont pas réimprimées
  ORDERS.forEach(o => { if (!printed.has(o.id)) printed.add(o.id); }); ls.set("mado-printed", [...printed].slice(-300).join(","));
  $("#start").style.display = "none";
};

async function start(){
  $("#login").style.display = "none"; $("#app").style.display = "block";
  await load(); setInterval(load, 4000);
}
$("#loginForm").onsubmit = async (e) => {
  e.preventDefault(); token = $("#pw").value;
  const r = await api("/api/login", {method: "POST"});
  if (r.ok) { ls.set("mado-kitchen", token); start(); } else $("#err").textContent = "Mot de passe incorrect";
};
(async () => { if (token) { const r = await api("/api/login", {method: "POST"}).catch(() => null); if (r && r.ok) start(); } })();
</script>
</body>
</html>
