<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mado · Menu</title>
<meta name="description" content="Restaurant Mado : kebab, pides, pizzas, assiettes. Menu en français, English, Türkçe, Deutsch.">
<meta name="theme-color" content="#1c1c1c">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#161616; --surface:#222; --surface-2:#2b2b2b; --line:#333;
  --text:#f4f1ec; --muted:#a9a39a; --accent:#f39200; --accent-ink:#1a1100; --green:#5cb85c;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}

/* ---------- Écran d'accueil / choix de langue ---------- */
#splash{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:28px;text-align:center;
  background:radial-gradient(120% 70% at 50% 0%,#2a2a2a 0%,var(--bg) 70%)}
#splash .logo{width:min(300px,78vw);border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#splash h1{margin:0;font-size:1.05rem;font-weight:500;color:var(--muted);letter-spacing:.02em}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(420px,100%)}
.langs button{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);font-size:1.05rem;font-weight:600;text-align:left;transition:border-color .15s,transform .1s}
.langs button:hover,.langs button:focus-visible{border-color:var(--accent);outline:none}
.langs button:active{transform:scale(.98)}
.langs .flag{font-size:1.6rem;line-height:1}
.langs small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}

/* ---------- Menu ---------- */
#app{display:none}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(22,22,22,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.bar .logo{height:40px;border-radius:8px;cursor:pointer}
.bar .spacer{flex:1}
.lang-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem}
.search{max-width:760px;margin:0 auto;padding:0 16px 10px}
.search input{width:100%;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:16px}
.search input:focus{outline:none;border-color:var(--accent)}
nav.cats{max-width:760px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
nav.cats::-webkit-scrollbar{display:none}
nav.cats a{flex:none;padding:7px 14px;border-radius:999px;background:var(--surface-2);color:var(--text);text-decoration:none;font-size:.88rem;font-weight:600;white-space:nowrap;border:1px solid transparent}
nav.cats a.active{background:var(--accent);color:var(--accent-ink)}
main{max-width:760px;margin:0 auto;padding:8px 16px 48px}
section.cat{scroll-margin-top:150px;padding-top:18px}
section.cat h2{font-size:1.25rem;margin:0 0 4px;display:flex;align-items:center;gap:10px}
section.cat h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--accent),transparent);border-radius:2px}
.note{color:var(--muted);font-size:.88rem;margin:0 0 8px}
.items{display:grid;gap:10px;margin-top:10px}
@media (min-width:640px){.items{grid-template-columns:1fr 1fr}}
.item{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:96px}
.item .ph{flex:none;width:92px;height:92px;border-radius:10px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:2.2rem}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.item h3{margin:0;font-size:1rem;font-weight:650}
.item p{margin:3px 0 0;color:var(--muted);font-size:.84rem}
.item .meta{margin-top:auto;padding-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.price{font-weight:800;color:var(--accent);font-size:1.05rem}
.badge{font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(92,184,92,.15);color:#8fd88f;border:1px solid rgba(92,184,92,.35)}
.old{color:var(--muted);text-decoration:line-through;font-size:.85rem}
.badge.promo{background:rgba(243,146,0,.15);color:#ffb54d;border-color:rgba(243,146,0,.45)}
.promos{display:grid;gap:10px;margin-top:14px}
.promo-card{border-radius:var(--radius);padding:14px 16px;background:linear-gradient(135deg,#3a2400,#2a1a00);border:1px solid rgba(243,146,0,.5)}
.promo-card strong{display:block;color:var(--accent);font-size:1.05rem}
.promo-card span{color:var(--text);font-size:.9rem}
.promo-card small{display:block;color:var(--muted);margin-top:4px;font-size:.78rem}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{max-width:760px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.82rem;text-align:center}
footer .info{margin-bottom:8px;color:var(--text)}

/* ---------- Fiche produit personnalisable ---------- */
.item.custom{cursor:pointer;transition:border-color .15s,transform .1s}
.item.custom:hover{border-color:#555}
.item.custom:active{transform:scale(.985)}
.cust{font-size:.72rem;font-weight:700;color:var(--accent);margin-left:auto;white-space:nowrap}
.item .picked{font-size:.76rem;color:#8fd88f;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
#sheet.on{opacity:1;pointer-events:auto}
.sh{width:min(640px,100%);max-height:94vh;max-height:94dvh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(40px);transition:transform .25s cubic-bezier(.2,.8,.2,1);overflow:hidden}
#sheet.on .sh{transform:none}
.sh-scroll{overflow-y:auto;overscroll-behavior:contain;flex:1}
.sh-hero{position:relative;height:190px;background:radial-gradient(80% 90% at 50% 30%,#3a2a12,#1a1a1a);display:flex;align-items:center;justify-content:center}
.sh-hero img{width:100%;height:100%;object-fit:cover}
.sh-hero .big{font-size:5rem}
.sh-close{position:absolute;top:12px;left:12px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;font-size:1.3rem;display:flex;align-items:center;justify-content:center}
.sh-body{padding:16px 16px 8px}
.sh-body h2{margin:0;font-size:1.4rem}
.sh-body .d{color:var(--muted);margin:4px 0 0;font-size:.92rem}
.grp{margin-top:22px}
.grp-h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.grp-h h3{margin:0;font-size:1.05rem;text-transform:uppercase;letter-spacing:.04em}
.grp-h small{color:var(--muted);font-size:.78rem}
.grp-h .cnt{margin-left:auto;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.grp-h .cnt.ok{background:rgba(92,184,92,.18);color:#8fd88f}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:.8rem;font-weight:600;line-height:1.15;text-align:center;transition:border-color .12s,background .12s}
.tile .ic{width:52px;height:52px;display:flex;align-items:center;justify-content:center}
.tile .ic svg,.tile .ic img{width:52px;height:52px;object-fit:cover;border-radius:10px}
.tile .sup{font-size:.7rem;color:var(--accent);font-weight:700}
.tile.on{border-color:var(--accent);background:#2b2214}
.tile.on::after{content:"✓";position:absolute;top:5px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.75rem;font-weight:900;display:flex;align-items:center;justify-content:center}
.tile.pop .ic{animation:pop .28s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22) rotate(-6deg)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.tile.pop .ic{animation:none}.sh,#sheet{transition:none}}
.sh-bar{border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;background:var(--bg)}
.sh-bar .tot{flex:1;min-width:0}
.sh-bar .tot small{display:block;color:var(--muted);font-size:.75rem}
.sh-bar .tot b{font-size:1.25rem;color:var(--accent)}
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:800;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.recap{padding:22px 16px}
.recap h2{margin:0 0 4px;font-size:1.5rem}
.recap .hint{color:var(--muted);margin:0 0 16px;font-size:.9rem}
.recap .line{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.recap .line b{flex:none;width:40%;color:var(--muted);font-weight:600;font-size:.9rem}
.recap .line span{flex:1;font-weight:700;font-size:1.05rem}
.recap .big-total{display:flex;justify-content:space-between;margin-top:14px;font-size:1.3rem;font-weight:800}
.recap .big-total span:last-child{color:var(--accent)}
</style>
</head>
<body>

<div id="splash">
  <img class="logo" src="img/logo.svg" alt="Mado">
  <h1>Bienvenue · Welcome · Hoş geldiniz · Willkommen</h1>
  <div class="langs" id="langs"></div>
</div>

<div id="app">
  <header class="top">
    <div class="bar">
      <img class="logo" src="img/logo.svg" alt="Mado" id="homeLogo">
      <div class="spacer"></div>
      <button class="lang-btn" id="langBtn"></button>
    </div>
    <div class="search"><input id="q" type="search" autocomplete="off"></div>
    <nav class="cats" id="cats"></nav>
  </header>
  <main id="menu"></main>
  <footer id="footer"></footer>
  <div id="sheet" aria-hidden="true"><div class="sh" role="dialog" aria-modal="true"><div class="sh-scroll" id="shScroll"></div><div class="sh-bar" id="shBar"></div></div></div>
</div>

<script src="icons.js"></script>
<script>
const LANGS = [
  {code:"fr", flag:"🇫🇷", label:"Français", sub:"Menu en français"},
  {code:"en", flag:"🇬🇧", label:"English", sub:"Menu in English"},
  {code:"tr", flag:"🇹🇷", label:"Türkçe", sub:"Türkçe menü"},
  {code:"de", flag:"🇩🇪", label:"Deutsch", sub:"Speisekarte auf Deutsch"},
];
const LOCALES = {fr:"fr-FR", en:"en-IE", tr:"tr-TR", de:"de-DE"};
const ICONS = {menus:"🍱",pokebowl:"🥗",sandwichs:"🥙",assiettes:"🍽️",pides:"🫓",pizzas:"🍕",accompagnements:"🍟",boissons:"🥤",alcools:"🍺",desserts:"🍰"};
let MENU = null, lang = "fr", PROMOS = [];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t = (obj) => obj ? (obj[lang] || obj.fr || "") : "";
const ui = (k) => t(MENU.ui[k]);
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };

function fmtPrice(p){
  if (p === null || p === undefined || p === "") return ui("priceOnRequest");
  return new Intl.NumberFormat(LOCALES[lang], {style:"currency", currency:"EUR", minimumFractionDigits: Number.isInteger(+p) ? 0 : 2}).format(+p);
}

async function withDefaults(m){
  if (m.optionGroups) return m;
  try {
    const def = await (await fetch("menu.json", {cache:"no-store"})).json();
    m.optionGroups = def.optionGroups || []; m.ui = {...def.ui, ...m.ui};
    const o = {}; for (const c of def.categories) for (const it of c.items) o[it.id] = it.options || [];
    for (const c of m.categories) for (const it of c.items) if (!it.options) it.options = o[it.id] || [];
  } catch {}
  return m;
}

async function loadMenu(){
  if (window.MENU_EMBED) return window.MENU_EMBED;
  try { const r = await fetch("/api/menu", {cache:"no-store"}); if (r.ok && (r.headers.get("content-type")||"").includes("json")) return await r.json(); } catch {}
  // Aperçu sans serveur : on reprend les changements faits dans l'admin de démonstration
  try { const local = localStorage.getItem("mado-demo-menu"); if (local) return await withDefaults(JSON.parse(local)); } catch {}
  const r = await fetch("menu.json", {cache:"no-store"}); if (r.ok) return await r.json();
  throw new Error("menu indisponible");
}

function renderSplash(){
  const last = store.get("mado-lang");
  $("#langs").innerHTML = LANGS.map(l =>
    `<button data-lang="${l.code}" ${l.code===last?'style="border-color:var(--accent)"':''}><span class="flag">${l.flag}</span><span>${l.label}<small>${l.sub}</small></span></button>`).join("");
  $("#langs").onclick = (e) => { const b = e.target.closest("button"); if (b) openMenu(b.dataset.lang); };
}

function showSplash(){
  $("#app").style.display = "none"; $("#splash").style.display = "flex";
  history.replaceState(null, "", location.pathname);
  renderSplash(); window.scrollTo(0,0);
}

function openMenu(code){
  lang = code; store.set("mado-lang", code);
  document.documentElement.lang = code;
  $("#splash").style.display = "none"; $("#app").style.display = "block";
  history.replaceState(null, "", "?lang=" + code);
  const L = LANGS.find(l => l.code === code);
  $("#langBtn").innerHTML = `<span>${L.flag}</span><span>${code.toUpperCase()}</span>`;
  $("#q").placeholder = ui("search"); $("#q").value = "";
  renderMenu(); window.scrollTo(0,0);
}

/* ---------- Promos (heure de Paris) ---------- */
const DAYS = {fr:["lun","mar","mer","jeu","ven","sam","dim"],en:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],tr:["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"],de:["Mo","Di","Mi","Do","Fr","Sa","So"]};
function parisNow(){
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Paris",weekday:"short",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return { day: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(parts.weekday)+1, min: (+parts.hour)*60 + (+parts.minute), date: `${parts.year}-${parts.month}-${parts.day}` };
}
const toMin = (hm) => { if (!hm) return null; const [h,m] = hm.split(":").map(Number); return h*60+(m||0); };
function promoActive(p, now){
  if (!p.active) return false;
  if (p.startDate && now.date < p.startDate) return false;
  if (p.endDate && now.date > p.endDate) return false;
  const f = toMin(p.from), to = toMin(p.to);
  let day = now.day;
  if (f !== null && to !== null && to <= f) { // plage qui passe minuit (ex. 22:00 → 02:00)
    if (now.min >= f) {} else if (now.min < to) { day = day === 1 ? 7 : day - 1; } else return false;
  } else {
    if (f !== null && now.min < f) return false;
    if (to !== null && now.min >= to) return false;
  }
  return !p.days || !p.days.length || p.days.includes(day);
}
function activePromos(){ const now = parisNow(); return (MENU.promos || []).filter(p => promoActive(p, now)); }
function promoPrice(it, promos){
  let best = null;
  for (const p of promos) for (const x of (p.items || [])) if (x.id === it.id && x.price !== null && x.price !== "" && (best === null || +x.price < best)) best = +x.price;
  return best;
}
function promoWhen(p){
  const d = (p.days && p.days.length && p.days.length < 7) ? p.days.map(n => DAYS[lang][n-1]).join(", ") : "";
  const h = (p.from || p.to) ? `${p.from || "00:00"}–${p.to || "24:00"}` : "";
  return [d, h].filter(Boolean).join(" · ");
}

function itemCard(it, catId){
  const ph = it.photo ? `<img src="${esc(it.photo)}" alt="" loading="lazy">` : (ICONS[catId] || "🍴");
  const desc = t(it.description);
  const pp = promoPrice(it, PROMOS);
  const groups = itemGroups(it);
  const sel = SEL[it.id], pickedTxt = sel ? choiceSummary(it, sel) : "";
  return `<article class="item${groups.length ? " custom" : ""}" data-id="${esc(it.id)}"${groups.length ? ' role="button" tabindex="0"' : ""}>
    <div class="ph">${ph}</div>
    <div class="tx">
      <h3>${esc(t(it.name))}</h3>
      ${desc ? `<p>${esc(desc)}</p>` : ""}
      ${pickedTxt ? `<div class="picked">✓ ${esc(pickedTxt)}</div>` : ""}
      <div class="meta">${pp !== null && pp < +it.price ? `<span class="old">${esc(fmtPrice(it.price))}</span><span class="price">${esc(fmtPrice(pp))}</span><span class="badge promo">${esc(ui("promo"))}</span>` : `<span class="price">${esc(fmtPrice(it.price))}</span>`}${it.bestseller ? `<span class="badge">★ ${esc(ui("bestseller"))}</span>` : ""}${groups.length ? `<span class="cust">${esc(ui("customize"))} ›</span>` : ""}</div>
    </div>
  </article>`;
}

function renderMenu(){
  PROMOS = activePromos();
  const norm = (x) => x.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const q = norm($("#q").value.trim());
  const match = (it) => !q || norm(t(it.name) + " " + t(it.description) + " " + (it.name.fr || "")).includes(q);
  const cats = MENU.categories.filter(c => !c.hidden).map(c => ({...c, items: c.items.filter(it => !it.hidden && match(it))})).filter(c => c.items.length);
  const best = q ? [] : MENU.categories.filter(c=>!c.hidden).flatMap(c => c.items.filter(it => !it.hidden && it.bestseller).map(it => [it, c.id]));
  const sections = [];
  if (best.length) sections.push({id:"best", title:"★ " + ui("bestsellers"), html: best.map(([it,cid]) => itemCard(it,cid)).join("")});
  for (const c of cats) sections.push({id:c.id, title:t(c.name), note:t(c.note), html:c.items.map(it => itemCard(it,c.id)).join("")});

  $("#cats").innerHTML = sections.map(s => `<a href="#${s.id}" data-id="${s.id}">${esc(s.title)}</a>`).join("");
  const promoHtml = (!q && PROMOS.length) ? `<div class="promos">${PROMOS.map(p => `<div class="promo-card"><strong>🔥 ${esc(t(p.title))}</strong>${t(p.text)?`<span>${esc(t(p.text))}</span>`:""}${promoWhen(p)?`<small>${esc(promoWhen(p))}</small>`:""}</div>`).join("")}</div>` : "";
  $("#menu").innerHTML = promoHtml + (sections.length ? sections.map(s =>
    `<section class="cat" id="${s.id}"><h2>${esc(s.title)}</h2>${s.note?`<p class="note">${esc(s.note)}</p>`:""}<div class="items">${s.html}</div></section>`).join("")
    : `<p class="empty">${esc(ui("noResult"))}</p>`);
  const info = MENU.info || {};
  const lines = [info.address, info.phone, t(info.hours)].filter(Boolean).map(esc).join(" · ");
  $("#footer").innerHTML = `${lines?`<div class="info">${lines}</div>`:""}<div>${esc(ui("allergens"))}</div><div style="margin-top:6px">© Mado</div>`;
  spy();
}

let obs;
function spy(){
  if (obs) obs.disconnect();
  obs = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) {
      document.querySelectorAll("#cats a").forEach(a => a.classList.toggle("active", a.dataset.id === e.target.id));
      const a = document.querySelector(`#cats a[data-id="${e.target.id}"]`);
      if (a) a.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
    }
  }, {rootMargin:"-160px 0px -60% 0px"});
  document.querySelectorAll("section.cat").forEach(s => obs.observe(s));
}


/* ---------- Personnalisation ---------- */
const SEL = {};          // choix du client par produit : {groupId: [choiceId,…]}
let CUR = null;          // produit ouvert
const findItem = (id) => { for (const c of MENU.categories) for (const it of c.items) if (it.id === id) return [it, c]; return [null, null]; };
function itemGroups(it){
  const all = MENU.optionGroups || [];
  return (it.options || []).map(id => all.find(g => g.id === id)).filter(g => g && g.choices.some(c => !c.hidden));
}
function iconHtml(c){
  if (c.photo) return `<img src="${esc(c.photo)}" alt="" loading="lazy">`;
  return (window.MADO_ICONS || {})[c.icon] || (window.MADO_ICONS || {}).sauce || "";
}
function unitPrice(it){ const pp = promoPrice(it, PROMOS); return pp !== null && pp < +it.price ? pp : (+it.price || 0); }
function extras(it, sel){
  let x = 0;
  for (const g of itemGroups(it)) for (const id of (sel[g.id] || [])) { const c = g.choices.find(c => c.id === id); if (c) x += +c.price || 0; }
  return x;
}
function choiceSummary(it, sel){
  return itemGroups(it).map(g => {
    const ids = sel[g.id] || []; if (!ids.length) return "";
    const names = g.choices.filter(c => ids.includes(c.id) && !c.all).map(c => t(c.name));
    return names.join(", ");
  }).filter(Boolean).join(" · ");
}
function openSheet(id){
  const [it, cat] = findItem(id); if (!it) return;
  CUR = it; SEL[it.id] = SEL[it.id] || {};
  drawSheet(false);
  $("#sheet").classList.add("on"); $("#sheet").setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  $("#shScroll").scrollTop = 0;
}
function closeSheet(){
  $("#sheet").classList.remove("on"); $("#sheet").setAttribute("aria-hidden", "true");
  document.body.style.overflow = ""; CUR = null;
  const y = scrollY; renderMenu(); scrollTo(0, y);
}
function drawSheet(recap){
  const it = CUR, sel = SEL[it.id], groups = itemGroups(it);
  const total = unitPrice(it) + extras(it, sel);
  const cat = findItem(it.id)[1];
  const hero = it.photo ? `<img src="${esc(it.photo)}" alt="">` : `<span class="big">${ICONS[cat.id] || "🍴"}</span>`;
  if (recap) {
    $("#shScroll").innerHTML = `<div class="recap">
      <h2>${esc(t(it.name))}</h2><p class="hint">${esc(ui("showStaff"))}</p>
      ${groups.map(g => { const names = g.choices.filter(c => (sel[g.id]||[]).includes(c.id) && !c.all).map(c => t(c.name)); return `<div class="line"><b>${esc(t(g.name))}</b><span>${names.length ? esc(names.join(", ")) : "–"}</span></div>`; }).join("")}
      <div class="big-total"><span>${esc(ui("total"))}</span><span>${esc(fmtPrice(total))}</span></div></div>`;
    $("#shBar").innerHTML = `<button class="btn ghost" data-sh="edit">‹ ${esc(ui("customize"))}</button><span class="tot"></span><button class="btn" data-sh="close">OK</button>`;
    return;
  }
  $("#shScroll").innerHTML = `<div class="sh-hero">${hero}<button class="sh-close" data-sh="close" aria-label="Fermer">←</button></div>
    <div class="sh-body"><h2>${esc(t(it.name))}</h2>${t(it.description) ? `<p class="d">${esc(t(it.description))}</p>` : ""}
    ${groups.map(g => {
      const ids = sel[g.id] || [];
      const n = ids.filter(id => !g.choices.find(c => c.id === id)?.all).length;
      return `<div class="grp" data-g="${esc(g.id)}"><div class="grp-h"><h3>${esc(t(g.name))}</h3><small>${esc(ui(g.multi ? "severalChoices" : "oneChoice"))}</small><span class="cnt ${n ? "ok" : ""}">${n}${g.multi ? "" : "/1"}</span></div>
        <div class="tiles">${g.choices.filter(c => !c.hidden).map(c => `<button class="tile ${ids.includes(c.id) ? "on" : ""}" data-c="${esc(c.id)}" aria-pressed="${ids.includes(c.id)}"><span class="ic">${iconHtml(c)}</span><span>${esc(t(c.name))}</span>${+c.price ? `<span class="sup">+${esc(fmtPrice(c.price))}</span>` : ""}</button>`).join("")}</div></div>`;
    }).join("")}</div>`;
  drawBar();
}
function drawBar(){
  const it = CUR, sel = SEL[it.id];
  const total = unitPrice(it) + extras(it, sel);
  $("#shBar").innerHTML = `<span class="tot"><small>${esc(ui("total"))}</small><b>${esc(fmtPrice(total))}</b></span>
    ${Object.values(sel).some(a => a.length) ? `<button class="btn ghost" data-sh="reset">${esc(ui("reset"))}</button>` : ""}
    <button class="btn" data-sh="done">${esc(ui("done"))}</button>`;
}
function toggleChoice(gid, cid, tileEl){
  const g = (MENU.optionGroups || []).find(g => g.id === gid), c = g.choices.find(c => c.id === cid);
  const sel = SEL[CUR.id]; let ids = sel[gid] || [];
  const plain = g.choices.filter(x => !x.hidden && !x.all && !(+x.price));
  if (!g.multi) ids = ids.includes(cid) ? [] : [cid];
  else if (c.all) ids = ids.includes(cid) ? ids.filter(id => !plain.some(p => p.id === id) && id !== cid) : [...new Set([...ids, cid, ...plain.map(p => p.id)])];
  else {
    ids = ids.includes(cid) ? ids.filter(id => id !== cid) : [...ids, cid];
    const allC = g.choices.find(x => x.all);
    if (allC) { const full = plain.every(p => ids.includes(p.id)); ids = full ? [...new Set([...ids, allC.id])] : ids.filter(id => id !== allC.id); }
    if (g.max && ids.length > g.max) ids = ids.slice(-g.max);
  }
  sel[gid] = ids;
  // mise à jour sans tout redessiner (garde le défilement)
  const box = document.querySelector(`.grp[data-g="${CSS.escape(gid)}"]`);
  box.querySelectorAll(".tile").forEach(b => { const on = ids.includes(b.dataset.c); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  const n = ids.filter(id => !g.choices.find(x => x.id === id)?.all).length;
  const cnt = box.querySelector(".cnt"); cnt.textContent = n + (g.multi ? "" : "/1"); cnt.classList.toggle("ok", n > 0);
  tileEl.classList.remove("pop"); void tileEl.offsetWidth; tileEl.classList.add("pop");
  drawBar();
}
$("#menu").addEventListener("click", (e) => { const a = e.target.closest(".item.custom"); if (a) openSheet(a.dataset.id); });
$("#menu").addEventListener("keydown", (e) => { const a = e.target.closest(".item.custom"); if (a && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openSheet(a.dataset.id); } });
$("#sheet").addEventListener("click", (e) => {
  if (e.target.id === "sheet") return closeSheet();
  const tile = e.target.closest(".tile"); if (tile) return toggleChoice(tile.closest(".grp").dataset.g, tile.dataset.c, tile);
  const b = e.target.closest("[data-sh]"); if (!b) return;
  const a = b.dataset.sh;
  if (a === "close") closeSheet();
  else if (a === "reset") { SEL[CUR.id] = {}; drawSheet(false); }
  else if (a === "done") { drawSheet(true); $("#shScroll").scrollTop = 0; }
  else if (a === "edit") drawSheet(false);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && CUR) closeSheet(); });

$("#langBtn").onclick = showSplash;
$("#homeLogo").onclick = showSplash;
$("#q").oninput = renderMenu;
// les promos changent selon l'heure : on vérifie chaque minute
setInterval(() => { if (MENU && $("#app").style.display === "block") { const ids = activePromos().map(p=>p.id).join(); if (ids !== PROMOS.map(p=>p.id).join()) { const y = scrollY; renderMenu(); scrollTo(0, y); } } }, 60000);

(async () => {
  try { MENU = await loadMenu(); } catch (e) { document.body.innerHTML = '<p style="padding:40px;text-align:center">Menu indisponible, réessayez plus tard.</p>'; return; }
  const p = new URLSearchParams(location.search).get("lang");
  if (p && LANGS.some(l => l.code === p)) openMenu(p); else showSplash();
})();
</script>
