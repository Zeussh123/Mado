<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mado · Menu</title>
<meta name="description" content="Restaurant Mado : kebab, pides, pizzas, assiettes. Menu en français, English, Türkçe, Deutsch.">
<meta name="theme-color" content="#1c1c1c">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#161616; --surface:#222; --surface-2:#2b2b2b; --line:#333;
  --text:#f4f1ec; --muted:#a9a39a; --accent:#f39200; --accent-ink:#1a1100; --green:#5cb85c;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}

/* ---------- Écran d'accueil / choix de langue ---------- */
#splash{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:28px;text-align:center;
  background:radial-gradient(120% 70% at 50% 0%,#2a2a2a 0%,var(--bg) 70%)}
#splash .logo{width:min(320px,80vw);height:auto;filter:drop-shadow(0 8px 24px rgba(0,0,0,.5))}
#splash h1{margin:0;font-size:1.05rem;font-weight:500;color:var(--muted);letter-spacing:.02em}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(420px,100%)}
.langs button{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);font-size:1.05rem;font-weight:600;text-align:left;transition:border-color .15s,transform .1s}
.langs button:hover,.langs button:focus-visible{border-color:var(--accent);outline:none}
.langs button:active{transform:scale(.98)}
.langs .flag{font-size:1.6rem;line-height:1}
.langs small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}

/* ---------- Version serveur ---------- */
#staff{display:none;min-height:100vh;min-height:100dvh;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:22px;text-align:center;background:radial-gradient(120% 70% at 50% 0%,#2a2a2a 0%,var(--bg) 70%)}
#staff .logo{width:min(220px,60vw);height:auto}
#staffBody{width:100%;display:grid;justify-items:center;gap:18px}
#staff h1{margin:0;font-size:1.3rem}
#staff form{display:grid;gap:12px;width:min(320px,100%)}
#staff input{font-size:1.6rem;text-align:center;letter-spacing:.3em;padding:12px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);color:var(--text)}
#staff .err{color:#ff8d86;min-height:1.2em;margin:0}
.tpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;width:min(520px,100%)}
.tpick button{aspect-ratio:1;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);font-size:1.7rem;font-weight:900}
.tpick button:hover,.tpick button:focus-visible{border-color:var(--accent);outline:none}
.tpick .emp{grid-column:1/-1;aspect-ratio:auto;padding:18px;font-size:1.2rem;background:var(--accent);color:#1a1100;border-color:var(--accent)}
.staff-out{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.9rem}
#tableChip.click{cursor:pointer}

/* ---------- Menu ---------- */
#app{display:none}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(22,22,22,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.bar .logo{height:40px;width:auto;cursor:pointer}
.bar .spacer{flex:1}
.lang-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem}
.search{max-width:760px;margin:0 auto;padding:0 16px 10px}
.search input{width:100%;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:16px}
.search input:focus{outline:none;border-color:var(--accent)}
nav.cats{max-width:760px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
nav.cats::-webkit-scrollbar{display:none}
nav.cats a{flex:none;padding:7px 14px;border-radius:999px;background:var(--surface-2);color:var(--text);text-decoration:none;font-size:.88rem;font-weight:600;white-space:nowrap;border:1px solid transparent}
nav.cats a.active{background:var(--accent);color:var(--accent-ink)}
main{max-width:760px;margin:0 auto;padding:8px 16px 48px}
section.cat{scroll-margin-top:150px;padding-top:18px}
section.cat h2{font-size:1.25rem;margin:0 0 4px;display:flex;align-items:center;gap:10px}
section.cat h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--accent),transparent);border-radius:2px}
.note{color:var(--muted);font-size:.88rem;margin:0 0 8px}
.items{display:grid;gap:10px;margin-top:10px}
@media (min-width:640px){.items{grid-template-columns:1fr 1fr}}
.item{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:96px}
.item .ph{flex:none;width:92px;height:92px;border-radius:10px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:2.2rem}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.item h3{margin:0;font-size:1rem;font-weight:650}
.item p{margin:3px 0 0;color:var(--muted);font-size:.84rem}
.item .meta{margin-top:auto;padding-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.price{font-weight:800;color:var(--accent);font-size:1.05rem}
.badge{font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(92,184,92,.15);color:#8fd88f;border:1px solid rgba(92,184,92,.35)}
.old{color:var(--muted);text-decoration:line-through;font-size:.85rem}
.badge.promo{background:rgba(243,146,0,.15);color:#ffb54d;border-color:rgba(243,146,0,.45)}
.promos{display:grid;gap:10px;margin-top:14px}
.promo-card{border-radius:var(--radius);padding:14px 16px;background:linear-gradient(135deg,#3a2400,#2a1a00);border:1px solid rgba(243,146,0,.5)}
.promo-card strong{display:block;color:var(--accent);font-size:1.05rem}
.promo-card span{color:var(--text);font-size:.9rem}
.promo-card small{display:block;color:var(--muted);margin-top:4px;font-size:.78rem}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{max-width:760px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.82rem;text-align:center}
footer .info{margin-bottom:8px;color:var(--text)}

/* ---------- Fiche produit personnalisable ---------- */
.item.custom{cursor:pointer;transition:border-color .15s,transform .1s}
.item.custom:hover{border-color:#555}
.item.custom:active{transform:scale(.985)}
.cust{font-size:.72rem;font-weight:700;color:var(--accent);margin-left:auto;white-space:nowrap}
.item .picked{font-size:.76rem;color:#8fd88f;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
#sheet.on{opacity:1;pointer-events:auto}
.sh{width:min(640px,100%);max-height:94vh;max-height:94dvh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(40px);transition:transform .25s cubic-bezier(.2,.8,.2,1);overflow:hidden}
#sheet.on .sh{transform:none}
.sh-scroll{overflow-y:auto;overscroll-behavior:contain;flex:1}
.sh-hero{position:relative;height:190px;background:radial-gradient(80% 90% at 50% 30%,#3a2a12,#1a1a1a);display:flex;align-items:center;justify-content:center}
.sh-hero img{width:100%;height:100%;object-fit:cover}
.sh-hero .big{font-size:5rem}
.sh-close{position:absolute;top:12px;left:12px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;font-size:1.3rem;display:flex;align-items:center;justify-content:center}
.sh-body{padding:16px 16px 8px}
.sh-body h2{margin:0;font-size:1.4rem}
.sh-body .d{color:var(--muted);margin:4px 0 0;font-size:.92rem}
.grp{margin-top:22px}
.grp-h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.grp-h h3{margin:0;font-size:1.05rem;text-transform:uppercase;letter-spacing:.04em}
.grp-h small{color:var(--muted);font-size:.78rem}
.grp-h .cnt{margin-left:auto;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.grp-h .cnt.ok{background:rgba(92,184,92,.18);color:#8fd88f}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:.8rem;font-weight:600;line-height:1.15;text-align:center;transition:border-color .12s,background .12s}
.tile .ic{width:52px;height:52px;display:flex;align-items:center;justify-content:center}
.tile .ic svg,.tile .ic img{width:52px;height:52px;object-fit:cover;border-radius:10px}
.tile .sup{font-size:.7rem;color:var(--accent);font-weight:700}
.tile.on{border-color:var(--accent);background:#2b2214}
.tile.on::after{content:"✓";position:absolute;top:5px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.75rem;font-weight:900;display:flex;align-items:center;justify-content:center}
.tile.pop .ic{animation:pop .28s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22) rotate(-6deg)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.tile.pop .ic{animation:none}.sh,#sheet{transition:none}}
.sh-bar{border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;background:var(--bg)}
.sh-bar .tot{flex:1;min-width:0}
.sh-bar .tot small{display:block;color:var(--muted);font-size:.75rem}
.sh-bar .tot b{font-size:1.25rem;color:var(--accent)}
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:800;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.recap{padding:22px 16px}
.recap h2{margin:0 0 4px;font-size:1.5rem}
.recap .hint{color:var(--muted);margin:0 0 16px;font-size:.9rem}
.recap .line{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.recap .line b{flex:none;width:40%;color:var(--muted);font-weight:600;font-size:.9rem}
.recap .line span{flex:1;font-weight:700;font-size:1.05rem}
.recap .big-total{display:flex;justify-content:space-between;margin-top:14px;font-size:1.3rem;font-weight:800}
.recap .big-total span:last-child{color:var(--accent)}

.cust.plusb{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800}
.btn.grow{flex:1}
.btn.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(243,146,0,.55)}50%{box-shadow:0 0 0 10px rgba(243,146,0,0)}}
#cartPill{position:fixed;z-index:45;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:12px 18px 12px 12px;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.45);white-space:nowrap}
#cartPill[hidden]{display:none}
#cartPill .cnum{min-width:28px;height:28px;border-radius:999px;background:var(--accent-ink);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.9rem}
#cartPill.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.15)}100%{transform:translateX(-50%) scale(1)}}
main{padding-bottom:96px}
.upsell{position:relative;padding:28px 18px 10px;text-align:center;overflow:hidden}
.ups-badge{display:inline-block;padding:6px 14px;border-radius:999px;background:#3a2400;color:#ffb54d;font-weight:800;font-size:.85rem;animation:wiggle 1.2s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.ups-art{display:flex;align-items:center;justify-content:center;gap:6px;margin:22px 0 10px}
.ups-art > span:not(.plus){width:78px;height:78px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;animation:popin .5s cubic-bezier(.3,1.6,.5,1) both}
.ups-art .a2{animation-delay:.15s!important}.ups-art .a3{animation-delay:.3s!important}
.ups-art svg{width:60px;height:60px}.ups-art img{width:100%;height:100%;object-fit:cover}
.ups-art .emo,.sv .emo{font-size:2.6rem}
.ups-art .plus{font-size:1.5rem;font-weight:900;color:var(--accent)}
@keyframes popin{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.upsell h2{margin:8px 0 4px;font-size:1.45rem;text-wrap:balance}
.ups-desc{color:var(--muted);margin:0}
.ups-price{display:inline-block;margin-top:16px;padding:10px 20px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:1.5rem;font-weight:900;transform:rotate(-2deg);animation:popin .5s .45s cubic-bezier(.3,1.6,.5,1) both}
.confetti{position:absolute;left:50%;top:45%;width:8px;height:12px;border-radius:2px;pointer-events:none;animation:conf .85s ease-out forwards}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.sugg{padding:20px 16px 8px;position:relative}
.added-line{display:flex;align-items:center;gap:8px;color:#8fd88f;font-weight:700;font-size:.9rem}
.added-line .ok{width:24px;height:24px;border-radius:50%;background:#2e5e2e;display:flex;align-items:center;justify-content:center;animation:popin .4s cubic-bezier(.3,1.6,.5,1)}
.sugg h2{margin:14px 0 12px;font-size:1.4rem}
.sug-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.sug{cursor:pointer;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px;animation:popin .45s var(--d) cubic-bezier(.3,1.4,.5,1) both;overflow:visible}
.sug .sv{height:84px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.sug .sv img{width:100%;height:100%;object-fit:cover}
.sug .sn{font-weight:650;font-size:.88rem;line-height:1.2}
.sug .sp{color:var(--accent);font-weight:800}
.sug .sadd{position:absolute;right:8px;bottom:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.4rem;font-weight:900}
.sug.got{border-color:#5cb85c}
.sug.got .sadd{background:#5cb85c;color:#fff}
.done-anim{padding:60px 0;text-align:center}
.done-anim .check{width:84px;height:84px;margin:0 auto;border-radius:50%;background:#5cb85c;color:#fff;font-size:2.6rem;font-weight:900;display:flex;align-items:center;justify-content:center;animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
.done-anim p{font-weight:800;font-size:1.2rem}
.cart{padding:20px 16px}
.cart-h{display:flex;align-items:center}
.cart-h h2{flex:1;margin:0;font-size:1.5rem}
.sh-x{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-2)}
.cart .hint{color:var(--muted);margin:4px 0 14px}
.clw{position:relative;border-bottom:1px dashed var(--line);overflow:hidden;transition:height .25s ease,opacity .25s}
.cl{position:relative;display:flex;gap:10px;align-items:center;padding:12px 0;background:var(--bg);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cl.back{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.cl-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#5a1f1c;color:#ffd7d4;font-weight:800;opacity:0;transition:background .15s}
.cl-bg.armed{background:#d63b33;color:#fff}
.cart .hint small{color:var(--muted);font-size:.8rem}
.cq{display:flex;align-items:center;gap:6px}
.cq button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-weight:800}
.cq b{min-width:16px;text-align:center}
.ct{flex:1;min-width:0}.cn{font-weight:700}.cs{color:var(--muted);font-size:.82rem}
.cp{font-weight:800;color:var(--accent);white-space:nowrap}
.cart .big-total{display:flex;justify-content:space-between;margin-top:16px;font-size:1.35rem;font-weight:800}
.cart .big-total span:last-child{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.ups-badge,.btn.pulse,.ups-art > span,.ups-price,.sug,#cartPill.bump{animation:none!important}}

.tbl{font-size:.82rem;font-weight:800;padding:6px 11px;border-radius:999px;background:#2e3a1c;color:#c4de68;border:1px solid #4a5e2a}
.note-in{width:100%;margin-top:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:16px;resize:vertical}
.send-err{color:#ff8d86;font-weight:600}
.sent{position:relative;text-align:center;padding:36px 16px 16px}
.sent .check{width:88px;height:88px;margin:0 auto;border-radius:50%;background:#5cb85c;color:#fff;font-size:2.8rem;font-weight:900;display:flex;align-items:center;justify-content:center}
.sent.fresh .check{animation:popin .5s cubic-bezier(.3,1.6,.5,1)}
.sent h2{margin:16px 0 4px;font-size:1.5rem}
.sent .onum{margin:0;color:var(--muted);font-weight:600}
.status{display:inline-flex;align-items:center;gap:10px;margin-top:20px;padding:12px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:1.05rem}
.status .dot,#cartPill .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:blink 1.2s ease-in-out infinite}
.status.st-ready{background:#1f3a1f;border-color:#5cb85c;color:#bff0bf}
.status.st-ready .dot,#cartPill.ready .dot{background:#5cb85c;animation:none}
@keyframes blink{50%{opacity:.25}}
/* panier commun */
.av{flex:none;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:.8rem;color:#111}
.avs{display:inline-flex}.avs .av{width:22px;height:22px;font-size:.62rem;margin-left:-6px;border:2px solid var(--accent-ink)}.avs .av:first-child{margin-left:0}
#cartPill.shared{border-radius:18px;padding:10px 16px;flex-direction:column;align-items:stretch;gap:3px;min-width:min(330px,calc(100vw - 32px))}
#cartPill.shared b{font-size:1rem}
#cartPill.shared small{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700}
.person{border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:12px;background:var(--surface)}
.person.me{border-color:var(--accent)}
.ph{display:flex;align-items:center;gap:10px;font-weight:800}
.ph .stt{margin-left:auto;font-size:.75rem;border-radius:999px;padding:4px 10px}
.stt.ok{background:#1d3d1d;color:#9fe39f}.stt.wait{background:#3a2e14;color:#ffd38a}
.person .cl{background:var(--surface)}
.oline{display:flex;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.oline:first-of-type{border-top:0}
.splitchk{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700}
.splitchk input{width:20px;height:20px;accent-color:var(--accent)}
.warnbox{background:#3a2e14;color:#ffd38a;border-radius:12px;padding:10px 12px;margin-top:12px;font-weight:600}
.join{padding:26px 18px 8px;display:grid;gap:12px}
.join h2{margin:0;font-size:1.4rem;text-wrap:balance}
.join p{margin:0;color:var(--muted)}
.join .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}

</style>

<body>

<div id="splash">
  <img class="logo" src="img/logo.png" alt="Mado">
  <h1>Bienvenue · Welcome · Hoş geldiniz · Willkommen</h1>
  <div class="langs" id="langs"></div>
</div>

<div id="staff">
  <img class="logo" src="img/logo.png" alt="Mado">
  <div id="staffBody"></div>
</div>

<div id="app">
  <header class="top">
    <div class="bar">
      <img class="logo" src="img/logo.png" alt="Mado" id="homeLogo">
      <div class="spacer"></div>
      <span class="tbl" id="tableChip" hidden></span>
      <button class="lang-btn" id="langBtn"></button>
    </div>
    <div class="search"><input id="q" type="search" autocomplete="off"></div>
    <nav class="cats" id="cats"></nav>
  </header>
  <main id="menu"></main>
  <footer id="footer"></footer>
  <button id="cartPill" hidden></button>
  <div id="toast" hidden></div>
  <div id="sheet" aria-hidden="true"><div class="sh" role="dialog" aria-modal="true"><div class="sh-scroll" id="shScroll"></div><div class="sh-bar" id="shBar"></div></div></div>
</div>

<script src="icons.js"></script>
<script>
const LANGS = [
  {code:"fr", flag:"🇫🇷", label:"Français", sub:"Menu en français"},
  {code:"en", flag:"🇬🇧", label:"English", sub:"Menu in English"},
  {code:"tr", flag:"🇹🇷", label:"Türkçe", sub:"Türkçe menü"},
  {code:"de", flag:"🇩🇪", label:"Deutsch", sub:"Speisekarte auf Deutsch"},
];
const LOCALES = {fr:"fr-FR", en:"en-IE", tr:"tr-TR", de:"de-DE"};
const ICONS = {menus:"🍱",pokebowl:"🥗",sandwichs:"🥙",assiettes:"🍽️",pides:"🫓",pizzas:"🍕",accompagnements:"🍟",boissons:"🥤",alcools:"🍺",desserts:"🍰"};
let MENU = null, lang = "fr", PROMOS = [];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t = (obj) => obj ? (obj[lang] || obj.fr || "") : "";
const ui = (k) => t(MENU.ui[k]);
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };

function fmtPrice(p){
  if (p === null || p === undefined || p === "") return ui("priceOnRequest");
  return new Intl.NumberFormat(LOCALES[lang], {style:"currency", currency:"EUR", minimumFractionDigits: Number.isInteger(+p) ? 0 : 2}).format(+p);
}

// Mises à jour ponctuelles d'un menu déjà enregistré (appliquées une seule fois)
function applyMigrations(m){
  m.applied = m.applied || [];
  if (!m.applied.includes("piment-2026-11")) {
    const gr = (id) => (m.optionGroups || []).find((g) => g.id === id);
    const cr = gr("crudites"), sa = gr("sauces");
    if (cr) for (const c of cr.choices) if (c.id === "piment-vert") c.apart = true;
    if (sa && !sa.choices.some((c) => c.id === "piment-poudre"))
      sa.choices.push({ id: "piment-poudre", name: { fr: "Piment en poudre", en: "Spicy (chili powder)", tr: "Pul biber", de: "Chilipulver (scharf)" }, icon: "piment-poudre", photo: "", price: 0, hidden: false, apart: true });
    m.applied.push("piment-2026-11");
  }
  return m;
}
async function withDefaults(m){
  // complète un menu enregistré avec une ancienne version du site
  try {
    const def = await (await fetch("menu.json", {cache:"no-store"})).json();
    // groupes d'options ajoutés depuis : on les ajoute avec leurs réglages par défaut (sauf si le gérant les a supprimés)
    m.optionGroups = m.optionGroups || [];
    const have = new Set(m.optionGroups.map(g => g.id)), removed = new Set(m.removedGroups || []);
    const added = (def.optionGroups || []).filter(g => !have.has(g.id) && !removed.has(g.id));
    m.optionGroups.push(...added);
    const addedIds = new Set(added.map(g => g.id));
    m.ui = {...def.ui, ...m.ui};
    if (m.ordering === undefined) m.ordering = def.ordering;
    const di = {}, dc = {};
    for (const c of def.categories) { dc[c.id] = c; for (const it of c.items) di[it.id] = it; }
    for (const c of m.categories) {
      if (c.suggest === undefined) c.suggest = (dc[c.id] && dc[c.id].suggest) || [];
      for (const it of c.items) {
        const d = di[it.id];
        if (it.options === undefined) it.options = (d && d.options) || [];
        else if (d && addedIds.size) for (const id of (d.options || [])) if (addedIds.has(id) && !it.options.includes(id)) it.options.push(id);
        if (it.upgrade === undefined) it.upgrade = (d && d.upgrade) || "";
      }
    }
    applyMigrations(m);
  } catch {}
  return m;
}

async function loadMenu(){
  if (window.MENU_EMBED) return window.MENU_EMBED;
  try { const r = await fetch("/api/menu", {cache:"no-store"}); if (r.ok && (r.headers.get("content-type")||"").includes("json")) return await r.json(); } catch {}
  // Aperçu sans serveur : on reprend les changements faits dans l'admin de démonstration
  try { const local = localStorage.getItem("mado-demo-menu"); if (local) return await withDefaults(JSON.parse(local)); } catch {}
  const r = await fetch("menu.json", {cache:"no-store"}); if (r.ok) return await r.json();
  throw new Error("menu indisponible");
}

function renderSplash(){
  const last = store.get("mado-lang");
  $("#langs").innerHTML = LANGS.map(l =>
    `<button data-lang="${l.code}" ${l.code===last?'style="border-color:var(--accent)"':''}><span class="flag">${l.flag}</span><span>${l.label}<small>${l.sub}</small></span></button>`).join("");
  $("#langs").onclick = (e) => { const b = e.target.closest("button"); if (b) openMenu(b.dataset.lang); };
}

function showSplash(){
  $("#app").style.display = "none"; $("#splash").style.display = "flex";
  history.replaceState(null, "", location.pathname);
  renderSplash(); window.scrollTo(0,0);
}

function openMenu(code){
  lang = code; store.set("mado-lang", code);
  document.documentElement.lang = code;
  $("#splash").style.display = "none"; $("#staff").style.display = "none"; $("#app").style.display = "block";
  history.replaceState(null, "", "?lang=" + code);
  const L = LANGS.find(l => l.code === code);
  $("#langBtn").innerHTML = `<span>${L.flag}</span><span>${code.toUpperCase()}</span>`;
  $("#q").placeholder = ui("search"); $("#q").value = "";
  if (TABLE) { $("#tableChip").hidden = false; $("#tableChip").textContent = tableLabel(); }
  renderMenu(); drawPill(); window.scrollTo(0,0);
  if (SHARED()) tbStart();
}

/* ---------- Promos (heure de Paris) ---------- */
const DAYS = {fr:["lun","mar","mer","jeu","ven","sam","dim"],en:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],tr:["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"],de:["Mo","Di","Mi","Do","Fr","Sa","So"]};
function parisNow(){
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Paris",weekday:"short",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return { day: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(parts.weekday)+1, min: (+parts.hour)*60 + (+parts.minute), date: `${parts.year}-${parts.month}-${parts.day}` };
}
const toMin = (hm) => { if (!hm) return null; const [h,m] = hm.split(":").map(Number); return h*60+(m||0); };
function promoActive(p, now){
  if (!p.active) return false;
  if (p.startDate && now.date < p.startDate) return false;
  if (p.endDate && now.date > p.endDate) return false;
  const f = toMin(p.from), to = toMin(p.to);
  let day = now.day;
  if (f !== null && to !== null && to <= f) { // plage qui passe minuit (ex. 22:00 → 02:00)
    if (now.min >= f) {} else if (now.min < to) { day = day === 1 ? 7 : day - 1; } else return false;
  } else {
    if (f !== null && now.min < f) return false;
    if (to !== null && now.min >= to) return false;
  }
  return !p.days || !p.days.length || p.days.includes(day);
}
function activePromos(){ const now = parisNow(); return (MENU.promos || []).filter(p => promoActive(p, now)); }
function promoPrice(it, promos){
  let best = null;
  for (const p of promos) for (const x of (p.items || [])) if (x.id === it.id && x.price !== null && x.price !== "" && (best === null || +x.price < best)) best = +x.price;
  return best;
}
function promoWhen(p){
  const d = (p.days && p.days.length && p.days.length < 7) ? p.days.map(n => DAYS[lang][n-1]).join(", ") : "";
  const h = (p.from || p.to) ? `${p.from || "00:00"}–${p.to || "24:00"}` : "";
  return [d, h].filter(Boolean).join(" · ");
}

function itemCard(it, catId){
  const ph = it.photo ? `<img src="${esc(it.photo)}" alt="" loading="lazy">` : (ICONS[catId] || "🍴");
  const desc = t(it.description);
  const pp = promoPrice(it, PROMOS);
  const groups = itemGroups(it);
  return `<article class="item custom" data-id="${esc(it.id)}" role="button" tabindex="0">
    <div class="ph">${ph}</div>
    <div class="tx">
      <h3>${esc(t(it.name))}</h3>
      ${desc ? `<p>${esc(desc)}</p>` : ""}
      <div class="meta">${pp !== null && pp < +it.price ? `<span class="old">${esc(fmtPrice(it.price))}</span><span class="price">${esc(fmtPrice(pp))}</span><span class="badge promo">${esc(ui("promo"))}</span>` : `<span class="price">${esc(fmtPrice(it.price))}</span>`}${it.bestseller ? `<span class="badge">★ ${esc(ui("bestseller"))}</span>` : ""}${groups.length ? `<span class="cust">${esc(ui("customize"))} ›</span>` : `<span class="cust plusb" aria-hidden="true">+</span>`}</div>
    </div>
  </article>`;
}

function renderMenu(){
  PROMOS = activePromos();
  const norm = (x) => x.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const q = norm($("#q").value.trim());
  const match = (it) => !q || norm(t(it.name) + " " + t(it.description) + " " + (it.name.fr || "")).includes(q);
  const cats = MENU.categories.filter(c => !c.hidden).map(c => ({...c, items: c.items.filter(it => !it.hidden && match(it))})).filter(c => c.items.length);
  const best = q ? [] : MENU.categories.filter(c=>!c.hidden).flatMap(c => c.items.filter(it => !it.hidden && it.bestseller).map(it => [it, c.id]));
  const sections = [];
  if (best.length) sections.push({id:"best", title:"★ " + ui("bestsellers"), html: best.map(([it,cid]) => itemCard(it,cid)).join("")});
  for (const c of cats) sections.push({id:c.id, title:t(c.name), note:t(c.note), html:c.items.map(it => itemCard(it,c.id)).join("")});

  $("#cats").innerHTML = sections.map(s => `<a href="#${s.id}" data-id="${s.id}">${esc(s.title)}</a>`).join("");
  const promoHtml = (!q && PROMOS.length) ? `<div class="promos">${PROMOS.map(p => `<div class="promo-card"><strong>🔥 ${esc(t(p.title))}</strong>${t(p.text)?`<span>${esc(t(p.text))}</span>`:""}${promoWhen(p)?`<small>${esc(promoWhen(p))}</small>`:""}</div>`).join("")}</div>` : "";
  $("#menu").innerHTML = promoHtml + (sections.length ? sections.map(s =>
    `<section class="cat" id="${s.id}"><h2>${esc(s.title)}</h2>${s.note?`<p class="note">${esc(s.note)}</p>`:""}<div class="items">${s.html}</div></section>`).join("")
    : `<p class="empty">${esc(ui("noResult"))}</p>`);
  const info = MENU.info || {};
  const lines = [info.address, info.phone, t(info.hours)].filter(Boolean).map(esc).join(" · ");
  $("#footer").innerHTML = `${lines?`<div class="info">${lines}</div>`:""}<div>${esc(ui("allergens"))}</div><div style="margin-top:6px">© Mado</div>`;
  spy();
}

let obs;
function spy(){
  if (obs) obs.disconnect();
  obs = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) {
      document.querySelectorAll("#cats a").forEach(a => a.classList.toggle("active", a.dataset.id === e.target.id));
      const a = document.querySelector(`#cats a[data-id="${e.target.id}"]`);
      if (a) a.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
    }
  }, {rootMargin:"-160px 0px -60% 0px"});
  document.querySelectorAll("section.cat").forEach(s => obs.observe(s));
}


/* ---------- Fiche produit, panier et suggestions ---------- */
let SEL = {};            // choix en cours pour le produit ouvert : {groupId: [choiceId,…]}
let CUR = null;          // produit ouvert
let STEP = "item";       // item | upsell | suggest | cart
let LAST = null;         // dernière ligne ajoutée (pour proposer le menu)
// Table : le QR code de chaque table ouvre le site avec ?t=numéro
// Version serveur (/serveur) : pas de choix de langue, pas de propositions, table choisie à la main ou « à emporter »
const STAFF = location.pathname.replace(/\/+$/, "") === "/serveur";
let STAFF_CODE = (() => { try { return localStorage.getItem("mado-staff") || ""; } catch { return ""; } })();
// code secret de la table (dans le QR code)
let TKEY = (() => { const k = new URLSearchParams(location.search).get("k"); try { if (k && /^[a-f0-9]{6,20}$/.test(k)) sessionStorage.setItem("mado-tkey", k); return sessionStorage.getItem("mado-tkey") || ""; } catch { return k || ""; } })();
let TABLE = STAFF ? "" : (() => {
  const q = new URLSearchParams(location.search).get("t");
  try { if (q && /^\d{1,3}$/.test(q)) sessionStorage.setItem("mado-table", q); return sessionStorage.getItem("mado-table") || ""; } catch { return q || ""; }
})();
let ORDERS = (() => { try { return JSON.parse(sessionStorage.getItem("mado-orders")) || []; } catch { return []; } })();
const saveOrders = () => { try { sessionStorage.setItem("mado-orders", JSON.stringify(ORDERS)); } catch {} };
const canOrder = () => TABLE && (STAFF || (MENU.ordering && MENU.ordering.enabled));
const tableLabel = () => TABLE === "EMP" ? "À emporter" : `${ui("table")} ${TABLE}`;
let CART = (() => { try { return JSON.parse(sessionStorage.getItem("mado-cart")) || []; } catch { return []; } })();
const saveCart = () => { try { sessionStorage.setItem("mado-cart", JSON.stringify(CART)); } catch {} };
const fill = (s, vars) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");

const findItem = (id) => { for (const c of MENU.categories) for (const it of c.items) if (it.id === id) return [it, c]; return [null, null]; };
const visibleItem = (id) => { const [it, c] = findItem(id); return it && !it.hidden && !c.hidden ? it : null; };
function itemGroups(it){
  const all = MENU.optionGroups || [];
  return (it.options || []).map(id => all.find(g => g.id === id)).filter(g => g && g.choices.some(c => !c.hidden));
}
function iconHtml(c){
  if (c.photo) return `<img src="${esc(c.photo)}" alt="" loading="lazy">`;
  return (window.MADO_ICONS || {})[c.icon] || (window.MADO_ICONS || {}).sauce || "";
}
function itemVisual(it){
  if (it.photo) return `<img src="${esc(it.photo)}" alt="" loading="lazy">`;
  const cat = findItem(it.id)[1];
  return `<span class="emo">${ICONS[cat && cat.id] || "🍴"}</span>`;
}
function unitPrice(it){ const pp = promoPrice(it, PROMOS); return pp !== null && pp < +it.price ? pp : (+it.price || 0); }
function extras(it, sel){
  let x = 0;
  for (const g of itemGroups(it)) {
    const ids = sel[g.id] || [];
    for (const id of ids) { const c = g.choices.find(c => c.id === id); if (c) x += +c.price || 0; }
    // ex. sauces : 2 incluses, chaque sauce en plus est payante
    if (+g.free && +g.extraPrice) { const n = ids.filter(id => { const c = g.choices.find(c => c.id === id); return c && !c.all && !c.apart; }).length; x += Math.max(0, n - g.free) * g.extraPrice; }
  }
  return Math.round(x * 100) / 100;
}
const groupHint = (g) => (+g.free && +g.extraPrice) ? fill(ui("freeHint"), {n: g.free, p: fmtPrice(g.extraPrice)}) : ui(g.multi ? "severalChoices" : "oneChoice");
function choiceSummary(it, sel){
  return itemGroups(it).map(g => {
    const ids = sel[g.id] || [], all = g.choices.find(c => c.all && ids.includes(c.id));
    // « Tout » coché : on l'écrit au lieu de lister chaque crudité (les suppléments payants restent affichés)
    const shown = g.choices.filter(c => ids.includes(c.id) && !c.all && !(all && !(+c.price) && !c.apart));
    return [all ? t(all.name) : "", ...shown.map(c => t(c.name))].filter(Boolean).join(", ");
  }).filter(Boolean).join(" · ");
}
const allLines = () => SHARED() ? TB.lines : CART;
const cartCount = () => allLines().reduce((n, l) => n + l.qty, 0);
const cartTotal = () => allLines().reduce((n, l) => n + l.qty * l.price, 0);

/* ----- ouverture / fermeture ----- */
function showSheet(){
  $("#sheet").classList.add("on"); $("#sheet").setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden"; $("#shScroll").scrollTop = 0;
}
function openItem(id, prefill){
  const it = visibleItem(id); if (!it) return;
  CUR = it; SEL = prefill ? JSON.parse(JSON.stringify(prefill)) : {}; STEP = "item";
  drawSheet(); showSheet();
}
function openCart(){ CUR = null; STEP = "cart"; drawSheet(); showSheet(); }
function closeSheet(){
  $("#sheet").classList.remove("on"); $("#sheet").setAttribute("aria-hidden", "true");
  document.body.style.overflow = ""; CUR = null; drawPill();
}

/* ----- ajout au panier et enchaînement ----- */
function addCurrent(){
  const it = CUR, price = unitPrice(it) + extras(it, SEL);
  LAST = {key: newKey(), id: it.id, sel: SEL, price, qty: 1};
  cartAdd(LAST); bumpPill();
  const up = it.upgrade && visibleItem(it.upgrade);
  if (STAFF) { flashAdded(); return; }
  if (up && unitPrice(up) > unitPrice(it)) { STEP = "upsell"; drawSheet(); return; }
  goSuggest(it);
}
function suggestionsFor(it){
  const cat = findItem(it.id)[1]; const inCart = new Set(CART.map(l => l.id));
  return (cat && cat.suggest || []).map(visibleItem).filter(x => x && !inCart.has(x.id) && x.id !== it.id).slice(0, 6);
}
function goSuggest(it){
  if (!suggestionsFor(it).length) { flashAdded(); return; }
  CUR = it; STEP = "suggest"; drawSheet(); $("#shScroll").scrollTop = 0;
}
function flashAdded(){
  $("#shScroll").innerHTML = `<div class="done-anim"><div class="check">✓</div><p>${esc(ui("added"))}</p></div>`;
  $("#shBar").innerHTML = "";
  setTimeout(closeSheet, 750);
}
function acceptMenu(){
  const it = CUR, menu = visibleItem(it.upgrade);
  cartRemove(LAST.key); drawPill();
  burst($("#shScroll .upsell"));
  // on garde les choix déjà faits (viande, crudités, sauces) et on ouvre le menu
  setTimeout(() => { CUR = menu; SEL = JSON.parse(JSON.stringify(LAST.sel)); STEP = "item"; drawSheet(); $("#shScroll").scrollTop = 0; }, 450);
}

/* ----- dessin de la fiche ----- */
// ce que le menu ajoute : frites et/ou boisson, d'après ses options et sa description
function upsellArt(it, menu){
  const desc = (menu.description && menu.description.fr || "").toLowerCase(), opts = menu.options || [];
  const parts = [`<span class="a1">${itemVisual(it)}</span>`];
  if (opts.includes("sauce-frites") || desc.includes("frite")) parts.push(`<span class="a2">${MADO_ICONS.frites}</span>`);
  if (opts.includes("boisson") || desc.includes("boisson")) parts.push(`<span class="a3">${MADO_ICONS.canette}</span>`);
  return parts.join('<span class="plus">+</span>');
}
function drawSheet(){
  if (STEP === "cart") return drawCart();
  const it = CUR;
  if (STEP === "upsell") {
    const menu = visibleItem(it.upgrade), diff = unitPrice(menu) - unitPrice(it);
    $("#shScroll").innerHTML = `<div class="upsell">
      <div class="ups-badge">🔥 ${esc(ui("goodDeal"))}</div>
      <div class="ups-art">${upsellArt(it, menu)}</div>
      <h2>${esc(fill(ui("makeMenu"), {menu: t(menu.name)}))}</h2>
      ${t(menu.description) ? `<p class="ups-desc">${esc(t(menu.description))}</p>` : ""}
      <div class="ups-price">${esc(fill(ui("onlyMore"), {x: fmtPrice(diff)}))}</div>
    </div>`;
    $("#shBar").innerHTML = `<button class="btn ghost" data-sh="noMenu">${esc(ui("noThanks"))}</button><button class="btn grow pulse" data-sh="yesMenu">${esc(ui("yesMenu"))}</button>`;
    return;
  }
  if (STEP === "suggest") {
    const list = suggestionsFor(it);
    $("#shScroll").innerHTML = `<div class="sugg">
      <div class="added-line"><span class="ok">✓</span> ${esc(t(it.name))} · ${esc(ui("added"))}</div>
      <h2>${esc(ui("withThat"))}</h2>
      <div class="sug-grid">${list.map((x, i) => `<div class="sug" style="--d:${i * 70}ms" data-id="${esc(x.id)}">
        <div class="sv">${itemVisual(x)}</div><div class="sn">${esc(t(x.name))}</div>
        <div class="sp">${esc(fmtPrice(unitPrice(x)))}</div>
        <button class="sadd" data-sh="sugAdd" aria-label="${esc(ui("add"))}">+</button></div>`).join("")}</div>
    </div>`;

/* ----- glisser pour retirer une ligne du panier ----- */
// Il faut glisser au-delà de 45 % de la largeur pour retirer : un petit geste revient en place.
(function(){
  let sw = null;
  const root = () => $("#shScroll");
  document.addEventListener("pointerdown", (e) => {
    const row = e.target.closest && e.target.closest(".clw .cl"); if (!row || STEP !== "cart") return;
    sw = {row, wrap: row.parentElement, x: e.clientX, y: e.clientY, dx: 0, on: false, id: e.pointerId};
  });
  document.addEventListener("pointermove", (e) => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (!sw.on) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; }   // c'est un défilement vertical
      if (Math.abs(dx) < 12) return;
      sw.on = true; window.SWIPING = true; sw.row.classList.remove("back"); try { sw.row.setPointerCapture(e.pointerId); } catch {}
    }
    sw.dx = dx;
    const w = sw.row.offsetWidth, armed = Math.abs(dx) > w * 0.45;
    sw.row.style.transform = `translateX(${dx}px)`;
    const bg = sw.wrap.querySelector(".cl-bg");
    bg.style.opacity = Math.min(1, Math.abs(dx) / 60);
    bg.style.justifyContent = dx > 0 ? "flex-start" : "flex-end";
    bg.querySelectorAll("span")[0].style.display = dx > 0 ? "" : "none";
    bg.querySelectorAll("span")[1].style.display = dx > 0 ? "none" : "";
    if (armed !== bg.classList.contains("armed")) { bg.classList.toggle("armed", armed); if (armed && navigator.vibrate) navigator.vibrate(15); }
  });
  const end = (e) => {
    if (!sw || (e.pointerId !== undefined && e.pointerId !== sw.id)) return;
    const s = sw; sw = null; window.SWIPING = false; if (!s.on) return;
    const w = s.row.offsetWidth;
    // évite le « clic » sur + / − à la fin du geste
    s.wrap.addEventListener("click", (ev) => { ev.stopPropagation(); ev.preventDefault(); }, {capture: true, once: true});
    if (Math.abs(s.dx) > w * 0.45) {
      s.row.classList.add("back"); s.row.style.transform = `translateX(${s.dx > 0 ? w : -w}px)`;
      s.wrap.style.height = s.wrap.offsetHeight + "px";
      setTimeout(() => { s.wrap.style.height = "0px"; s.wrap.style.opacity = "0"; }, 180);
      setTimeout(() => { cartRemove(s.wrap.dataset.k); drawCart(); drawPill(); }, 430);
    } else {
      s.row.classList.add("back"); s.row.style.transform = "";
      const bg = s.wrap.querySelector(".cl-bg"); bg.style.opacity = 0; bg.classList.remove("armed");
    }
  };
  document.addEventListener("pointerup", end);
  document.addEventListener("pointercancel", end);
})();

const newKey = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const COLORS = ["#f39200", "#7cc4ff", "#b9d76a", "#f28cb1", "#c9a3ff", "#ffd166", "#5ee0c3", "#ff8a65"];

// horaires de commande (même règle que le serveur)
function orderingOpen(){
  const o = MENU.ordering || {}, sch = o.schedule;
  if (!o.useSchedule || !sch) return true;
  const now = parisNow(), prev = now.day === 1 ? 7 : now.day - 1;
  for (const r of sch[now.day] || []) { const f = toMin(r.from), to = toMin(r.to); if (f === null || to === null) continue; if (to > f ? now.min >= f && now.min < to : now.min >= f) return true; }
  for (const r of sch[prev] || []) { const f = toMin(r.from), to = toMin(r.to); if (f === null || to === null) continue; if (to <= f && now.min < to) return true; }
  return false;
}

  // mes plats (pour les propositions et le geste « glisser pour retirer »)

  // un ami vient d'ajouter un plat

    if (fresh.length) { const l = fresh[fresh.length - 1], it = findItem(l.id)[0]; if (it) toast(member(l.m), fill(ui("tbAdded"), {name: mname(member(l.m)), item: t(it.name)})); }

  }
}

  if (STEP === "remind") {
    const n = CART.reduce((n, l) => n + l.qty, 0), name = meM().name;
    $("#shScroll").innerHTML = `<div class="ask"><div class="big">⏰</div><h2>${esc(ui("tbRemindH"))}${name ? `<br><small style="font-size:1rem;color:var(--muted)">${esc(name)}</small>` : ""}</h2><p>${esc(fill(ui("tbRemindP"), {n}))}</p></div>`;
    $("#shBar").innerHTML = `<button class="btn ghost" data-sh="tbContinue">${esc(ui("tbContinue"))}</button><button class="btn grow" data-sh="tbYes">${esc(ui("tbYes"))}</button>`;
  } else {
    $("#shScroll").innerHTML = `<div class="ask"><div class="big">🎉</div><h2>${esc(ui("tbAllH"))}</h2><p>${esc(ui("tbAllP"))}</p>
      <div class="big-total" style="width:100%;display:flex;justify-content:space-between;font-weight:800;font-size:1.2rem"><span>${esc(fill(ui("tbItems"), {n: cartCount()}))}</span><span style="color:var(--accent)">${esc(fmtPrice(cartTotal()))}</span></div></div>`;
    $("#shBar").innerHTML = `<button class="btn ghost" data-sh="cart">${esc(ui("seeOrder"))}</button><button class="btn grow pulse" data-sh="tbSendForce">${esc(ui("tbSend"))}</button>`;
  }
}
function drawTableCart(){
  const owners = tbOwners(), me = meM(), mine = TB.lines.some(l => l.m === ME);
  const line = (l, editable) => {
    const it = findItem(l.id)[0]; if (!it) return "";
    const s = choiceSummary(it, l.sel || {});
    const body = `<div class="ct"><div class="cn">${l.qty} × ${esc(t(it.name))}</div>${s ? `<div class="cs">${esc(s)}</div>` : ""}</div><div class="cp">${esc(fmtPrice(l.price * l.qty))}</div>`;
    if (!editable) return `<div class="oline">${body}</div>`;
    return `<div class="clw" data-k="${esc(l.k)}"><div class="cl-bg"><span>🗑 ${esc(ui("remove"))}</span><span>${esc(ui("remove"))} 🗑</span></div><div class="cl">
      <div class="cq"><button data-sh="minus" aria-label="-">−</button><b>${l.qty}</b><button data-sh="plus" aria-label="+">+</button></div>${body.replace(`${l.qty} × `, "")}</div></div>`;
  };
  const people = owners.length ? owners : [];
  $("#shScroll").innerHTML = `<div class="cart">
    <div class="cart-h"><h2>${esc(ui("tbBasket"))} · ${esc(tableLabel())}</h2><button class="sh-x" data-sh="close" aria-label="Fermer">✕</button></div>
    <p class="hint">${esc(ui("payAtCounter"))}${mine ? `<br><small>↔ ${esc(ui("tbSwipe"))}</small>` : ""}</p>
    ${people.length ? people.map(m => `<div class="person ${m.id === ME ? "me" : ""}"><div class="ph">${avatar(m)}<span>${esc(mname(m))}${m.id === ME ? ` (${esc(ui("tbYou"))})` : ""}</span>
        <span class="stt ${m.ready ? "ok" : "wait"}">${esc(ui(m.ready ? "tbDone" : "tbChoosing"))}</span></div>
        ${TB.lines.filter(l => l.m === m.id).map(l => line(l, m.id === ME)).join("")}</div>`).join("") : `<p class="empty">${esc(ui("emptyOrder"))}</p>`}
    ${TB.lines.length ? `<div class="big-total"><span>${esc(ui("tbTotal"))}</span><span>${esc(fmtPrice(cartTotal()))}</span></div>
      <textarea id="orderNote" class="note-in" rows="2" maxlength="300" placeholder="${esc(ui("notePh"))}"></textarea>
      ${owners.length > 1 ? `<label class="splitchk"><input type="checkbox" id="tbSplit" ${SPLIT ? "checked" : ""}> ${esc(ui("tbSplit"))}</label>` : ""}` : ""}
    ${sendConfirm ? `<div class="warnbox">${esc(fill(ui("tbWait"), {names: owners.filter(m => !m.ready && m.id !== ME).map(mname).join(", ")}))}</div>` : ""}
  </div>`;
  if (!TB.lines.length) { $("#shBar").innerHTML = `<button class="btn grow" data-sh="close">OK</button>`; return; }
  if (!orderingOpen()) {
    $("#shScroll .cart").insertAdjacentHTML("beforeend", `<div class="warnbox">${esc(ui("tbHours"))}</div>`);
    $("#shBar").innerHTML = `<button class="btn grow" data-sh="close">OK</button>`; return;
  }
  const readyBtn = mine ? `<button class="btn ghost" data-sh="tbReady">${esc(ui(me.ready ? "tbNotDone" : "tbImDone"))}</button>` : "";
  $("#shBar").innerHTML = sendConfirm
    ? `<button class="btn ghost" data-sh="tbCancel">${esc(ui("tbLater"))}</button><button class="btn grow" data-sh="tbSendForce">${esc(ui("tbSendAnyway"))}</button>`
    : `${readyBtn}<button class="btn grow pulse" data-sh="tbSend">${esc(ui("tbSend"))} · ${esc(fmtPrice(cartTotal()))}</button>`;
}
async function tbSendNow(btn){
  btn.disabled = true; btn.textContent = ui("sending");
  const j = await tbPost("send", {note: ($("#orderNote") || {}).value || "", split: SPLIT && tbOwners().length > 1});
  if (j) SPLIT = false;
  if (!j) { btn.disabled = false; btn.textContent = ui("tbSend"); toast(meM(), ui("sendError")); }
}
function tbAction(a, b){
  if (a === "tbJoin") {
    const name = ($("#tbName") || {}).value || ""; ss.set("mado-name", name.trim()); ss.set("mado-joined", "1");
    tbPost("join", {name: name.trim()}); closeSheet();
  } else if (a === "tbReady") { const r = !meM().ready; meM().ready = r; tbPost("ready", {ready: r}); drawTableCart(); }
  else if (a === "tbYes") { meM().ready = true; tbPost("ready", {ready: true}); closeSheet(); }
  else if (a === "tbContinue") { lastActivity = Date.now(); closeSheet(); }
  else if (a === "tbCancel") { sendConfirm = false; drawTableCart(); }
  else if (a === "tbSend") {
    const waiting = tbOwners().filter(m => !m.ready && m.id !== ME);
    if (waiting.length) { sendConfirm = true; drawTableCart(); $("#shScroll").scrollTop = 1e6; } else tbSendNow(b);
  }
  else if (a === "tbSendForce") tbSendNow(b);
}
// rappel : des plats dans le panier, pas « fini », rien ajouté depuis 1 minute
setInterval(() => {
  if (!SHARED() || $("#sheet").classList.contains("on") || $("#app").style.display !== "block") return;
  const me = meM();
  if (!CART.length || me.ready || Date.now() - lastActivity < 60000 || remindedAt > lastActivity) return;
  remindedAt = Date.now(); CUR = null; STEP = "remind"; drawAsk(); showSheet();
  if (navigator.vibrate) navigator.vibrate(80);
}, 5000);

/* ----- événements ----- */
$("#menu").addEventListener("click", (e) => { const a = e.target.closest(".item[data-id]"); if (a) openItem(a.dataset.id); });
$("#menu").addEventListener("keydown", (e) => { const a = e.target.closest(".item[data-id]"); if (a && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openItem(a.dataset.id); } });
$("#cartPill").onclick = () => { if (!cartCount() && ORDERS.some(o => o.status === "new" || o.status === "ready")) { CUR = null; STEP = "sent"; drawSent(false); showSheet(); } else openCart(); };
$("#sheet").addEventListener("change", (e) => { if (e.target.id === "tbSplit") SPLIT = e.target.checked; });
$("#sheet").addEventListener("click", (e) => {
  if (e.target.id === "sheet") return closeSheet();
  const tile = e.target.closest(".tile"); if (tile) return toggleChoice(tile.closest(".grp").dataset.g, tile.dataset.c, tile);
  // toute la carte d'une suggestion (photo, nom, prix) ajoute le produit, pas seulement le « + »
  let b = e.target.closest("[data-sh]");
  if (!b) { const card = e.target.closest(".sug"); if (card && !card.classList.contains("got")) b = card.querySelector('[data-sh="sugAdd"]'); }
  if (!b) return;
  const a = b.dataset.sh;
  if (a === "close") closeSheet();
  else if (a === "reset") { SEL = {}; drawSheet(); }
  else if (a === "add") addCurrent();
  else if (a === "yesMenu") acceptMenu();
  else if (a === "noMenu") goSuggest(CUR);
  else if (a === "cart") openCart();
  else if (a === "sugAdd") {
    const card = b.closest(".sug"), x = visibleItem(card.dataset.id); if (!x) return;
    if (itemGroups(x).length) return openItem(x.id);
    cartAdd({key: newKey(), id: x.id, sel: {}, price: unitPrice(x), qty: 1}); bumpPill();
    card.classList.add("got"); b.textContent = "✓"; b.disabled = true; burst(card);
    $("#shBar [data-sh=cart]").textContent = `${ui("seeOrder")} (${cartCount()})`;
  }
  else if (a === "minus" || a === "plus") {
    const k = b.closest(".clw").dataset.k, l = CART.find(x => String(x.key) === k); if (!l) return;
    cartSetQty(k, l.qty + (a === "plus" ? 1 : -1)); drawCart(); drawPill();
  }
  else if (a === "send") sendOrder(b);
  else if (a === "staffNext") { ORDERS = []; saveOrders(); TABLE = ""; closeSheet(); drawPill(); staffTables(); }
  else if (a === "clear") { cartClear(); drawCart(); drawPill(); }
  else if (a.startsWith("tb")) tbAction(a, b);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#sheet").classList.contains("on")) closeSheet(); });

$("#langBtn").onclick = showSplash;
$("#homeLogo").onclick = () => STAFF ? staffTables() : showSplash();
$("#tableChip").onclick = () => { if (STAFF) staffTables(); };

/* ---------- Version serveur ---------- */
function staffShow(html){
  $("#app").style.display = "none"; $("#splash").style.display = "none";
  $("#staff").style.display = "flex"; $("#staffBody").innerHTML = html; window.scrollTo(0, 0);
}
function staffLogin(){
  staffShow(`<h1>Prise de commande</h1><form id="staffForm"><input id="staffCode" type="password" inputmode="numeric" autocomplete="off" placeholder="Code" required><button class="btn grow" type="submit">Entrer</button><p class="err" id="staffErr"></p></form>`);
  $("#staffCode").focus();
  $("#staffForm").onsubmit = async (e) => {
    e.preventDefault(); const code = $("#staffCode").value.trim();
    const r = await fetch("/api/staff/login", {method: "POST", headers: {authorization: "Bearer " + code}}).catch(() => null);
    if (r && r.ok) { STAFF_CODE = code; try { localStorage.setItem("mado-staff", code); } catch {} staffTables(); }
    else $("#staffErr").textContent = r ? "Code incorrect" : "Pas de connexion";
  };
}
function staffLogout(){ STAFF_CODE = ""; try { localStorage.removeItem("mado-staff"); } catch {} closeSheet(); staffLogin(); }
function staffTables(){
  const n = parseInt((MENU.ordering || {}).tables) || 10;
  staffShow(`<h1>Quelle table ?</h1>
    <div class="tpick">${Array.from({length: n}, (_, i) => `<button data-t="${i + 1}">${i + 1}</button>`).join("")}<button class="emp" data-t="EMP">🛍 À emporter</button></div>
    ${CART.length ? `<p class="small" style="color:var(--muted)">La commande en cours (${cartCount()} article${cartCount() > 1 ? "s" : ""}) est gardée.</p>` : ""}
    <button class="staff-out" id="staffOut">Se déconnecter</button>`);
  $(".tpick").onclick = (e) => { const b = e.target.closest("[data-t]"); if (!b) return; TABLE = b.dataset.t; openMenu("fr"); };
  $("#staffOut").onclick = staffLogout;
}
$("#q").oninput = renderMenu;
// les promos changent selon l'heure : on vérifie chaque minute
setInterval(() => { if (MENU && $("#app").style.display === "block") { const ids = activePromos().map(p=>p.id).join(); if (ids !== PROMOS.map(p=>p.id).join()) { const y = scrollY; renderMenu(); scrollTo(0, y); } } }, 60000);

(async () => {
  try { MENU = await loadMenu(); } catch (e) { document.body.innerHTML = '<p style="padding:40px;text-align:center">Menu indisponible, réessayez plus tard.</p>'; return; }
  if (!STAFF) pollOrders();
  const p = new URLSearchParams(location.search).get("lang");
  if (STAFF) {
    $("#langBtn").style.display = "none"; $("#tableChip").classList.add("click"); lang = "fr";
    if (!STAFF_CODE) return staffLogin();
    const r = await fetch("/api/staff/login", {method: "POST", headers: {authorization: "Bearer " + STAFF_CODE}}).catch(() => null);
    return r && r.status === 401 ? staffLogout() : staffTables();
  }
  if (p && LANGS.some(l => l.code === p)) openMenu(p); else showSplash();
})();
</script>
